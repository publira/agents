packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  # react-email ships an esbuild binary for its preview CLI.
  esbuild: true
  lefthook: true
  sharp: true

catalog:
  "@base-ui/react": 1.8.0
  "@buf/googleapis_googleapis.bufbuild_es": 2.13.0-20260414192239-c17df5b2beca.1
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/semantic-conventions": 1.43.0
  "@publira/comic-viewer": 0.9.0
  "@publira/next-cache-handlers": 1.0.0
  "@tailwindcss/postcss": 4.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 24.19.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  jose: 6.2.12
  jsdom: 30.1.1
  lru-cache: 11.5.3
  next: 16.3.8
  opentype.js: 2.0.0
  p-retry: 8.0.1
  react: 19.3.0
  react-dom: 19.3.0
  react-email: 6.11.0
  react-markdown: 10.1.0
  redis: 6.3.0
  remark-gfm: 4.0.1
  schema-dts: 2.0.0
  tailwindcss: 4.3.3
  temporal-polyfill: 1.0.5
  tsdown: 0.23.0
  typescript: 6.0.3
  vitest: 5.0.3
  zod: 4.6.5

catalogMode: strict
# These packages come from this organization, so there is no reason to wait out
# the window that guards against a freshly published release.
minimumReleaseAgeExclude:
  - "@publira/*"
  # 16.3.8 is the September 2026 security release, published inside the
  # release-age window. Remove these lines once that version is old enough.
  - "@next/env@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - next@16.3.8
# Swallows the deferred error of a session destroyed on an idle GOAWAY, which
# otherwise surfaces as an uncaughtException (connectrpc/connect-es#1768).
patchedDependencies:
  "@connectrpc/connect-node@2.2.0": patches/@connectrpc__connect-node@2.2.0.patch
savePrefix: ""
