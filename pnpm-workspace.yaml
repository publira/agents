packages:
  - apps/*
  - packages/*

allowBuilds:
  lefthook: true

# Versions shared by more than one workspace package. `catalogMode: strict`
# makes `pnpm add` write `catalog:` for a dependency listed here, so the
# packages cannot drift apart.
catalog:
  "@types/node": 24.19.0
  tsdown: 0.23.0
  typescript: 7.0.2
  vitest: 5.0.2
  zod: 4.6.5

catalogMode: strict
savePrefix: ""
